# AnalysisTemplate that drives canary promotion/rollback from Instana metrics.
#
# The pod-template-hash arg scopes the query to the canary variant. Argo fills
# it in automatically from the canary ReplicaSet (see rollout.yaml), and Instana
# already carries that pod label on APM spans.
#
# Field names below match the verified Instana call-groups contract:
#   - kubernetes.pod.label is a KEY_VALUE_PAIR tag, so it needs `key` + `value`
#   - `selectGroup` picks the canary group when stable is also reporting
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: instana-canary
spec:
  args:
    - name: pod-template-hash
  metrics:
    - name: error-rate
      interval: 1m
      count: 5
      # errors is a ratio (0..1) in Instana, not a percentage.
      successCondition: result <= 0.05
      failureLimit: 2
      provider:
        plugin:
          argoproj-labs/instana:
            host: https://acme-prod.instana.io
            apiTokenEnv: INSTANA_API_TOKEN
            metric: errors
            aggregation: MEAN
            granularity: 60
            timeWindowMs: 300000
            # A pod-template-hash is a short hash and is NOT globally unique.
            # Always scope to the cluster and namespace, or the gate can blend
            # in traffic from a same-hash workload elsewhere.
            clusterName: my-cluster
            namespace: my-namespace
            groupByTag: kubernetes.pod.label
            groupByTagKey: rollouts-pod-template-hash
            groupByTagEntity: DESTINATION
            selectGroup: "{{args.pod-template-hash}}"
            tagFilters:
              - name: kubernetes.pod.label
                key: rollouts-pod-template-hash
                operator: EQUALS
                entity: DESTINATION
                value: "{{args.pod-template-hash}}"

    - name: latency-p90
      interval: 1m
      count: 5
      # milliseconds
      successCondition: result <= 500
      failureLimit: 2
      provider:
        plugin:
          argoproj-labs/instana:
            host: https://acme-prod.instana.io
            apiTokenEnv: INSTANA_API_TOKEN
            metric: latency
            aggregation: P90
            granularity: 60
            timeWindowMs: 300000
            clusterName: my-cluster
            namespace: my-namespace
            groupByTagKey: rollouts-pod-template-hash
            selectGroup: "{{args.pod-template-hash}}"
            tagFilters:
              - name: kubernetes.pod.label
                key: rollouts-pod-template-hash
                operator: EQUALS
                value: "{{args.pod-template-hash}}"
