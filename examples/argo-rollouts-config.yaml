# Registers the Instana metric provider plugin with the Argo Rollouts
# controller. Restart the controller after applying.
#
# Replace <version> with the release tag (e.g. v1.0.0) and update sha256
# with the matching value from the SHA256SUMS file on the GitHub release page:
#   https://github.com/instana/rollouts-plugin-metric-instana/releases
#
# Verify the binary before deploying:
#
#   # linux/amd64
#   curl -sSLO https://github.com/instana/rollouts-plugin-metric-instana/releases/download/<version>/rollouts-plugin-metric-instana_<version>_linux_amd64
#   curl -sSLO https://github.com/instana/rollouts-plugin-metric-instana/releases/download/<version>/rollouts-plugin-metric-instana_<version>_SHA256SUMS
#   sha256sum --check --ignore-missing rollouts-plugin-metric-instana_<version>_SHA256SUMS
#
# Air-gapped clusters: copy the binary into the controller pod via an
# initContainer or hostPath volume and use a file:// location instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argo-rollouts-config
  namespace: argo-rollouts
data:
  metricProviderPlugins: |-
    # linux/amd64 — update <version> and sha256 for each release
    - name: "instana/metrics"
      location: "https://github.com/instana/rollouts-plugin-metric-instana/releases/download/<version>/rollouts-plugin-metric-instana_<version>_linux_amd64"
      sha256: "<sha256-from-SHA256SUMS>"

    # linux/arm64 — use the arm64 binary and its checksum instead:
    # - name: "instana/metrics"
    #   location: "https://github.com/instana/rollouts-plugin-metric-instana/releases/download/<version>/rollouts-plugin-metric-instana_<version>_linux_arm64"
    #   sha256: "<sha256-from-SHA256SUMS>"

    # Air-gapped (file already on every node):
    # - name: "instana/metrics"
    #   location: "file:///plugins/rollouts-plugin-metric-instana"
    #   sha256: "<sha256-from-SHA256SUMS>"
