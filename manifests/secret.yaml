# The plugin reads the Instana API token from an env var on the rollouts
# controller (default INSTANA_API_TOKEN). Create the secret, then patch the
# controller Deployment to expose it (see README "Provide the API token").
apiVersion: v1
kind: Secret
metadata:
  name: instana-api-token
  namespace: argo-rollouts
type: Opaque
stringData:
  token: "<REPLACE_WITH_INSTANA_API_TOKEN>"
